# Gradle Version Catalog — single source of truth for plugin and
# library versions. Referenced from build.gradle.kts via
# `alias(libs.plugins.foo)` and `implementation(libs.bar)`.

[versions]

# ---- SDK version ----
# Default published version. Override at publish time via
# `./gradlew :video:publish -PsdkVersion=X.Y.Z` so CI can cut patch
# releases without bumping this file. Read at runtime as
# `KontextVideo.VERSION`, from a generated internal source (see video/build.gradle.kts).
sdk-kotlin-video = "0.1.0"

# ---- Build tooling ----
agp = "8.7.3"                       # Android Gradle Plugin
kotlin = "2.1.0"                   # Kotlin compiler version

# ---- AndroidX ----
androidx-activity = "1.8.2"             # ComponentActivity (interstitial back-press, example)
androidx-annotation = "1.8.0"
androidx-browser = "1.8.0"              # Custom Tabs for the click-through
androidx-core = "1.13.1"
androidx-lifecycle = "2.8.4"
androidx-webkit = "1.12.1"              # addWebMessageListener: the frame page's messages with their origin

# Compose — the example app only; the SDK renders classic Views into the
# container the app hands it.
compose = "1.7.7"
compose-material3 = "1.3.1"

# ---- Media3: the :video-media3 adapter, and the example's content player ----
media3 = "1.6.0"

# ---- Kontext ----
# Device info, install id, advertising id, TCF consent. 0.1.0 moved Open Measurement to its own artifact,
# which this SDK does not use: no OMSDK binary ships with it.
kontext-kit = "0.1.0"

# ---- Kotlin libraries ----
kotlinx-coroutines = "1.9.0"
kotlinx-serialization = "1.7.3"

# ---- Code-quality plugins ----
binary-compatibility-validator = "0.16.3"
maven-publish = "0.34.0"            # vanniktech maven-publish
spotless = "7.2.1"
detekt = "1.23.8"
ktlint = "0.50.0"                   # consumed inside spotless { ktlint(...) }

# ---- Test libraries ----
junit-jupiter = "5.10.1"
mockk = "1.13.13"
robolectric = "4.14.1"
mockwebserver = "4.12.0"
junit4 = "4.13.2"
junit-vintage = "5.10.1"
androidx-test-core = "1.6.1"
androidx-test-runner = "1.6.2"
androidx-test-ext-junit = "1.2.1"


[libraries]

# Kontext
kontext-kit = { module = "so.kontext.kit:kontext-kit-android", version.ref = "kontext-kit" }

# Kotlin
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# AndroidX
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }

# Jetpack Compose (example only)
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }

# Media3 (ExoPlayer) — example only
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }

# Test
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit-vintage" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }


[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
