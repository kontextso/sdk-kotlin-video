# Gradle Version Catalog — single source of truth for plugin and
# library versions. Referenced from build.gradle.kts via
# `alias(libs.plugins.foo)` and `implementation(libs.bar)`. Letting
# Gradle generate the type-safe accessors means version bumps happen
# in one place and IDE autocomplete works across all build files.

[versions]

# ---- SDK version ----
# Default published version. Override at publish time via
# `./gradlew :video:publish -PsdkVersion=X.Y.Z` so CI can cut patch
# releases without bumping this file. Read at runtime as
# `BuildConfig.SDK_VERSION` (see video/build.gradle.kts).
sdk-kotlin-video = "0.0.1"

# ---- Build tooling ----
# Pinned to exactly match the tvplus-test-player reference repo so the
# example and that app build against an identical toolchain.
agp = "8.6.1"                       # Android Gradle Plugin (matches tvplus-test-player)
kotlin = "2.0.21"                   # Kotlin compiler version (matches tvplus-test-player)

# ---- AndroidX ----
androidx-activity = "1.9.2"             # activity / activity-compose (matches tvplus-test-player)
androidx-lifecycle = "2.8.6"            # lifecycle-runtime-ktx (matches tvplus-test-player)
androidx-core = "1.13.1"                # core-ktx (matches tvplus-test-player)

# Compose BOM (Bill of Materials) — pins a version-aligned set of
# Compose libraries. Listing individual `androidx.compose.*` deps
# without versions lets the BOM resolve them, so they stay compatible.
# Samsung TV+ (and the tvplus-test-player) render their Media3 PlayerView
# inside a Jetpack Compose + Material3 UI, so :video and :example match.
compose-bom = "2024.09.03"          # matches tvplus-test-player

# ---- Media3 (ExoPlayer) ----
# Video playback for the :example app. The video SDK itself stays
# player-agnostic for now; the example demonstrates a typical Media3
# integration the SDK will later hook into. HLS + DASH mirror Samsung
# TV+'s FAST/SSAI stack (HLS-first, DASH for DRM vectors).
media3 = "1.4.1"

# ---- Kotlin libraries ----
kotlinx-coroutines = "1.8.1"
kotlinx-serialization = "1.6.2"

# ---- Code-quality plugins ----
maven-publish = "0.34.0"            # vanniktech maven-publish
spotless = "7.2.1"
detekt = "1.23.8"
ktlint = "0.50.0"                   # consumed inside spotless { ktlint(...) }

# ---- Test libraries ----
junit-jupiter = "5.10.1"
mockk = "1.13.9"


[libraries]

# Kotlin
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# AndroidX
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }

# Jetpack Compose — the BOM pins a version-aligned set; individual
# `androidx.compose.*` deps below are unversioned and inherit from it.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

# Media3 (ExoPlayer) — used by :example for video playback. HLS + DASH
# match Samsung TV+'s streaming formats; DRM lives in media3-exoplayer core.
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }

# Test
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }


[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
