# Gradle Version Catalog — single source of truth for plugin and
# library versions. Referenced from build.gradle.kts via
# `alias(libs.plugins.foo)` and `implementation(libs.bar)`.

[versions]

# ---- SDK version ----
# The published version: the release workflow publishes this value, after checking
# that the tag equals it (`-PsdkVersion=X.Y.Z` overrides it for a local build only). Read at runtime as
# `KontextVideo.VERSION`, from a generated internal source (see video/build.gradle.kts).
sdk-kotlin-video = "0.1.0"

# ---- Build tooling ----
agp = "8.7.3"                       # Android Gradle Plugin
kotlin = "2.1.0"                   # Kotlin compiler version

# ---- AndroidX ----
androidx-activity = "1.8.2"             # ComponentActivity (the linear ad's screen: Back does nothing; example)
androidx-annotation = "1.8.0"
androidx-core = "1.13.1"
androidx-webkit = "1.12.1"              # addWebMessageListener: the frame page's messages with their origin

# ---- Media3 ----
# The example's player. The :video-media3 adapter compiles against the floor instead: it uses only the Player
# interface of Media3 1.1, and an app's own Media3 version wins at resolution (1.6.0's metadata would raise
# every androidx.media3 module of the app to 1.6.0).
media3 = "1.6.0"
media3-adapter-floor = "1.1.1"

# ---- Compose ----
# :video-compose compiles against this floor, the oldest Compose it supports; an app's own, newer Compose wins at
# resolution, so the module never raises the app's Compose version.
compose-floor = "1.6.8"

# ---- TTSDK ----
# :video-ttsdk compiles against the oldest TTSDK it supports (1.40 added addVideoEngineCallback) and does not ship
# it: the app brings its own, licensed TTSDK.
ttsdk-floor = "1.40.1.5"

# ---- Tencent Cloud Player SDK (LiteAV) ----
# :video-txplayer compiles against the oldest Player SDK it supports and does not ship it: the app brings its own,
# licensed one. The adapter uses only TXVodPlayer's isPlaying and getCurrentPlaybackTime, unchanged since long before.
liteav-player-floor = "11.0.0.13110"
# The release check's and the adapter's emulator tests': a recent one, as an app has.
liteav-player = "13.3.0.20247"

# ---- Kontext ----
# Device info, install id, advertising id, TCF consent. 0.1.0 moved Open Measurement to its own artifact,
# which this SDK does not use: no OMSDK binary ships with it.
kontext-kit = "0.3.0"

# ---- Kotlin libraries ----
kotlinx-coroutines = "1.9.0"
kotlinx-serialization = "1.7.3"

# ---- Code-quality plugins ----
binary-compatibility-validator = "0.16.3"
maven-publish = "0.34.0"            # vanniktech maven-publish
spotless = "7.2.1"
detekt = "1.23.8"
ktlint = "0.50.0"                   # consumed inside spotless { ktlint(...) }

# ---- Test libraries ----
junit-jupiter = "5.10.1"
mockk = "1.13.13"
robolectric = "4.14.1"
mockwebserver = "4.12.0"
junit4 = "4.13.2"
junit-vintage = "5.10.1"
androidx-test-core = "1.6.1"
androidx-recyclerview = "1.3.2"
androidx-test-runner = "1.6.2"
androidx-test-ext-junit = "1.2.1"


[libraries]

# Kontext
kontext-kit = { module = "so.kontext.kit:kontext-kit-android", version.ref = "kontext-kit" }

# Kotlin
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# AndroidX
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }

# Media3: the example's player at media3; the adapter's floor
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
androidx-media3-common-floor = { module = "androidx.media3:media3-common", version.ref = "media3-adapter-floor" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }

# Compose: the floor :video-compose compiles against
androidx-compose-ui-floor = { module = "androidx.compose.ui:ui", version.ref = "compose-floor" }
androidx-compose-foundation-layout-floor = { module = "androidx.compose.foundation:foundation-layout", version.ref = "compose-floor" }
# Compose UI tests of :video-compose, at the same floor: a real composition on Robolectric
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose-floor" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose-floor" }

# TTSDK player (the BytePlus repository): compileOnly in :video-ttsdk
ttsdk-ttplayer-floor = { module = "com.bytedanceapi:ttsdk-ttplayer", version.ref = "ttsdk-floor" }

# Tencent Cloud Player SDK (Maven Central): compileOnly in :video-txplayer
liteav-player-floor = { module = "com.tencent.liteav:LiteAVSDK_Player", version.ref = "liteav-player-floor" }
liteav-player = { module = "com.tencent.liteav:LiteAVSDK_Player", version.ref = "liteav-player" }

# Test
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit-vintage" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recyclerview" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }


[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
