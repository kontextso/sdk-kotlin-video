complexity:
  LongMethod:
    threshold: 150
  LongParameterList:
    # Wire models and view constructors legitimately carry many named,
    # defaulted parameters; the public API mirrors sdk-swift-video's.
    functionThreshold: 8
    constructorThreshold: 16
    ignoreDefaultParameters: true
    ignoreAnnotated:
      - androidx.compose.runtime.Composable
  ComplexCondition:
    threshold: 6
  CyclomaticComplexMethod:
    # The protocol's dispatchers and the wire parsers are one `when` or one field after another: long, not tangled.
    ignoreSimpleWhenEntries: true
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 20
    thresholdInObjects: 15
    thresholdInEnums: 15
    ignoreDeprecated: false
    ignorePrivate: true
    ignoreOverridden: true

naming:
  FunctionNaming:
    ignoreAnnotated: [ 'Composable' ]
  TopLevelPropertyNaming:
    active: false
  EnumNaming:
    active: false
  MatchingDeclarationName:
    # Several files use package-concept names (DebugEvent.kt holds
    # DebugEventHandler; AdEvent.kt holds AdEventHandler) rather than
    # the single top-level declaration's name.
    active: false

style:
  # Properties first, then functions, then the companion object (Kotlin's class layout); the same inside a
  # companion: its constants at its top.
  ClassOrdering:
    active: true
  ForbiddenComment:
    active: false
  FunctionOnlyReturningConstant:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  SerialVersionUIDInSerializableClass:
    active: false
  ThrowsCount:
    active: false
  UnnecessaryAbstractClass:
    active: false
  UnusedPrivateMember:
    active: false

exceptions:
  # Boundary code (HTTP, JSON parsing, lifecycle callbacks) legitimately
  # catches Exception — narrowing here would lose the catch-all the
  # error reporting layer depends on.
  TooGenericExceptionCaught:
    active: false

empty-blocks:
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true

comments:
  # AGENTS.md: KDoc on every public declaration. The library's public API only; tests and the example are apps.
  UndocumentedPublicClass:
    active: true
    excludes: [ '**/test/**', '**/androidTest/**', '**/example/**', '**/extras/**' ]
  UndocumentedPublicFunction:
    active: true
    excludes: [ '**/test/**', '**/androidTest/**', '**/example/**', '**/extras/**' ]
  UndocumentedPublicProperty:
    active: true
    excludes: [ '**/test/**', '**/androidTest/**', '**/example/**', '**/extras/**' ]
