name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle's downloads. Each job keeps its own entry (an emulator job needs dependencies a lint job never
      # fetches), and the version catalog is in the key, so a dependency bump saves a new one.
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ github.job }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ github.job }}-
            ${{ runner.os }}-gradle-

      - name: Check Spotless (ktlint)
        run: ./gradlew spotlessCheck

      - name: Check Detekt
        run: ./gradlew detekt

      # Android Lint over the published libraries: manifest, resource prefix, thread annotations.
      - name: Check Android Lint
        run: ./gradlew :video:lintRelease :video-media3:lintRelease :video-ttsdk:lintRelease :video-compose:lintRelease

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ github.job }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ github.job }}-
            ${{ runner.os }}-gradle-

      # Robolectric fetches its Android jars itself, into ~/.m2, outside Gradle's cache: one for the tests' SDK
      # (robolectric.properties) and one for compileSdk's resources. Downloaded on every run, a refused fetch
      # (HTTP 429) fails every test that starts meanwhile; the key names exactly the jars a run needs.
      - name: Robolectric cache key
        id: robolectric
        run: |
          version=$(sed -n 's/^robolectric = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          sdk=$(sed -n 's/^sdk=//p' video/src/test/resources/robolectric.properties)
          compile=$(sed -n 's/^ *compileSdk = \([0-9]*\).*/\1/p' video/build.gradle.kts)
          echo "key=robolectric-$version-sdk$sdk-compile$compile" >> "$GITHUB_OUTPUT"

      - name: Cache Robolectric jars
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-${{ steps.robolectric.outputs.key }}

      - name: Build
        run: ./gradlew assembleDebug --stacktrace

      - name: Check the public API against */api/*.api
        run: ./gradlew apiCheck

      - name: Run unit tests
        run: ./gradlew :video:testDebug :video-media3:testDebug :video-ttsdk:testDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  # API 34, and API 26, the SDK's minSdk: what a newer Android API called without its version check breaks
  # there, not here. API 26's image comes with a WebView that may be too old for the page's messages (no
  # updates without Play), so the tests that need them skip there; the rest run on both.
  emulator-tests:
    name: Emulator Tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 26, 34 ]
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ github.job }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ github.job }}-
            ${{ runner.os }}-gradle-

      # The emulator's userdata partition needs more disk than a fresh runner has left.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /opt/hostedtoolcache/CodeQL

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # What needs a real WebView (the frame page's navigations, a frozen renderer, viewability on real views)
      # and a real ExoPlayer (the Media3 adapter over a playing clip).
      - name: Run the emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          # The WebView's version first: on API 26 it decides which tests skip.
          script: |
            adb shell dumpsys webviewupdate | grep -iE "current webview package|version" || true
            ./gradlew :video:connectedDebugAndroidTest :video-media3:connectedDebugAndroidTest

      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-test-reports-api-${{ matrix.api-level }}
          path: video/build/reports/androidTests/
          retention-days: 7

  release-check:
    name: Release check (R8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ github.job }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ github.job }}-
            ${{ runner.os }}-gradle-

      # The artifacts as a publisher gets them, then an app built only from those, minified by R8.
      - name: Publish to mavenLocal
        run: ./gradlew :video:publishToMavenLocal :video-media3:publishToMavenLocal :video-ttsdk:publishToMavenLocal :video-compose:publishToMavenLocal

      - name: Build the minified release check
        run: ./gradlew -p extras/release-check assembleRelease
