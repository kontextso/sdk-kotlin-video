name: Publish SDK

on:
  push:
    tags:
      - '*.*.*'
      - '*.*.*-SNAPSHOT'

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Tag matches the catalog version
        run: |
          catalog=$(sed -n 's/^sdk-kotlin-video *= *"\([^"]*\)".*/\1/p' gradle/libs.versions.toml)
          if [ "$catalog" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME differs from sdk-kotlin-video = \"$catalog\" in gradle/libs.versions.toml"
            exit 1
          fi

      - name: Checks and unit tests
        run: ./gradlew spotlessCheck detekt :video:lintRelease :video-media3:lintRelease assembleDebug apiCheck :video:testDebugUnitTest :video-media3:testDebugUnitTest

  publish:
    name: Publish to Maven Central
    needs: verify
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :video:publish :video-media3:publish
